[package]
name = "x86sim-core"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "x86Sim launcher core: chunked AOT image (static discovery, incremental build), feature toggles, sim control"

[lib]
name = "x86sim_core"
path = "src/lib.rs"

[[bin]]
name = "x86sim-aot"
path = "src/bin/aot.rs"

[[bin]]
name = "x86sim-mcp"
path = "src/bin/mcp.rs"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
png = "0.18"
