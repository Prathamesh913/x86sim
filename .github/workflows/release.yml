# x86Code release: a tag v<version>-pre<N> (or a manual run naming one) builds the AppImage and publishes a GitHub
# *pre-release* with the AppImage, its .zsync (for AppImageUpdate) and SHA256SUMS. Full releases (tags without -pre)
# are not published by this workflow yet, on purpose.
name: release
on:
  push:
    tags: ["v*-pre*"]
  workflow_dispatch:
    inputs:
      tag:
        description: pre-release tag to create, e.g. v0.1.0-pre1 (made on the selected commit)
        required: true
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x86code-appimage
          path: dist
      - name: Check the tag
        run: |
          T="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          case "$T" in v*-pre*) ;; *) echo "only pre-release tags (v*-pre*) are published here: $T"; exit 1 ;; esac
          echo "TAG=$T" >> "$GITHUB_ENV"
          ls -la dist
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: x86Code ${{ env.TAG }}
          prerelease: true
          draft: false
          generate_release_notes: true
          body: |
            Pre-release build. Download the AppImage, `chmod +x` it and run it: the setup wizard checks this computer,
            installs Darling into /opt/x86code (one password prompt), downloads iOS 27.2 from Apple (about 8 GB) and
            makes your first phone. See docs/RELEASE.md.
          files: |
            dist/*.AppImage
            dist/*.zsync
            dist/SHA256SUMS
